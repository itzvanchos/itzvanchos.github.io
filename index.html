<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanchos</title>
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" id="favicon">
    <link rel="stylesheet" href="static/common.css">
    <style>
        .content {
            padding-top: 80px;
            padding-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 576px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .panel {
            width: 100%;
            max-width: 576px;
            height: 64px;
            background-color: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            box-sizing: border-box;
            text-decoration: none;
            color: inherit;
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
        }

        .dark-theme .panel {
            background-color: #3c3c3c;
            border-color: #444746;
        }

        .panel:hover {
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .panel-logo {
            width: 32px;
            height: 32px;
            object-fit: cover;
        }

        .panel-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-left: 16px;
            flex: 1;
            min-width: 0;
        }

        .panel-title {
            font-size: 14px;
            font-weight: bold;
            line-height: 16px;
            height: 16px;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .panel-details {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 0;
            height: 16px;
            line-height: 16px;
        }

        .panel-nickname {
            font-size: 14px;
            color: #5f6368;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dark-theme .panel-nickname {
            color: #9aa0a6;
        }

        .panel-username {
            font-size: 14px;
            color: #5f6368;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dark-theme .panel-username {
            color: #9aa0a6;
        }

        @media (max-width: 608px) {
            .content {
                padding-left: 16px;
                padding-right: 16px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="Logo" class="navbar-logo" id="navbarLogo">
        </div>
        <div class="navbar-right">
            <button class="lang-toggle" id="langToggle">РУ</button>
            <button class="theme-toggle" id="themeToggle">
                <img src="static/theme.png" alt="Dark theme" class="theme-icon" id="themeIcon">
            </button>
        </div>
    </nav>

    <div class="content" id="contentContainer">
    </div>

    <script src="/static/common.js"></script>
    <script>
        const contentContainer = document.getElementById('contentContainer');

        let panelsDatabase = [];

        async function loadPanelFromGoogleSheets() {
            const response = await fetch(PUBLIC_SHEETS_URL);
            const csvText = await response.text();
            const rows = csvText.trim().split('\n');
            
            for (let i = 0; i < rows.length; i++) {
                const row = parseCSVRow(rows[i]);
                
                panelsDatabase.push({
                    title_en: row[2].trim(),
                    title_ru: row[3]?.trim() || '',
                    nickname: row[4].trim(),
                    username: row[5].trim(),
                    url: row[6].trim(),
                    logo_light: row[7].trim(),
                    logo_dark: row[8]?.trim() || ''
                });
            }
        }

        function applyPanelTheme() {
            const panels = document.querySelectorAll('.panel');
            panels.forEach(panel => {
                if (panel._panelData && panel._logoElement) {
                    const logoUrl = generalTheme === 'dark' && panel._panelData.logo_dark ? panel._panelData.logo_dark : panel._panelData.logo_light;
                    panel._logoElement.src = logoUrl;
                }
            });
        }

        function applyPanelLanguage() {
            const panels = document.querySelectorAll('.panel');
            panels.forEach(panel => {
                if (panel._panelData && panel._titleElement) {
                    const title = generalLanguage === 'ru' && panel._panelData.title_ru ? panel._panelData.title_ru : panel._panelData.title_en;
                    panel._titleElement.textContent = title;
                }
            });
        }

        function createPanel(panelData) {
            const panel = document.createElement('a');
            panel.className = 'panel';
            panel.href = panelData.url;
            panel.target = '_blank';
            panel.rel = 'noopener noreferrer';
            
            const logo = document.createElement('img');
            logo.className = 'panel-logo';
            logo.alt = panelData.title_en;
            panel.appendChild(logo);
            
            const content = document.createElement('div');
            content.className = 'panel-content';
            
            const title = document.createElement('div');
            title.className = 'panel-title';
            content.appendChild(title);
            
            const details = document.createElement('div');
            details.className = 'panel-details';
            
            const nickname = document.createElement('span');
            nickname.className = 'panel-nickname';
            nickname.textContent = panelData.nickname;
            
            const username = document.createElement('span');
            username.className = 'panel-username';
            username.textContent = panelData.username;
            
            details.appendChild(nickname);
            details.appendChild(username);
            content.appendChild(details);
            
            panel.appendChild(content);
            
            panel._panelData = panelData;
            panel._logoElement = logo;
            panel._titleElement = title;
            
            return panel;
        }

        function renderPanels() {
            contentContainer.innerHTML = '';
            
            panelsDatabase.forEach(panelData => {
                const panel = createPanel(panelData);
                contentContainer.appendChild(panel);
            });
        }

        async function init() {
            loadSettings();
            applyBodyTheme();
            applyLanguage();
            await loadLogoFromGoogleSheets();
            applyLogoTheme();
            await loadPanelFromGoogleSheets();
            renderPanels();
            applyPanelTheme();
            applyPanelLanguage();
        }

        init();

        themeToggle.addEventListener('click', () => {
            applyPanelTheme();
        });

        langToggle.addEventListener('click', () => {
            applyPanelLanguage();
        });
    </script>
</body>
</html>
